{% extends "core/base.html" %}

{% block title %}Server Error — Specc{% endblock %}

{% block content %}
<section class="section form-section" style="min-height: 60vh; display: flex; flex-direction: column; justify-content: center;">
    <div class="card" style="text-align: center; padding: 48px 32px;">
        <h1 style="font-size: 4rem; margin: 0; background: var(--accent-strong); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">500</h1>
        <h2 style="margin: 16px 0;">Server Error</h2>
        <p style="color: var(--muted); margin-bottom: 24px;">Something went wrong on our end. We've been notified and are working on it.</p>
        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <a class="btn btn--primary" href="{% url 'core:home' %}">Go Home</a>
            <a class="btn btn--ghost" href="mailto:hello@specc.studio">Report Issue</a>
        </div>
    </div>
</section>
{% endblock %}
